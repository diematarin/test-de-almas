<style>
/* Layout: una sola columna estrecha, una pregunta por pantalla, como una carta sobre la mesa de noche */
:root {
  --night: #15111f;
  --surface: #211b30;
  --line: #3a3150;
  --ink: #efe9f6;
  --muted: #a99fbd;
  --gold: #e8c46c;
  --violet: #7a3aa6;
  --violet-hi: #9150c0;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  min-height: 100%;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.6rem; }
h2 { font-size: 1.9rem; }
p { margin: 0; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* barra superior */
.top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.back { background: none; border: 0; color: var(--muted); font: inherit; font-size: .9rem; padding: 8px 4px; cursor: pointer; }
.back:disabled { visibility: hidden; }
.progress { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .35s ease; }
.count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }

/* portada */
.cover { border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.notice { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* botones */
.btn {
  appearance: none; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--violet); color: #fff; font: inherit; font-weight: 600;
  padding: 15px 22px; width: 100%; transition: background .2s;
}
.btn:hover { background: var(--violet-hi); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.gold { background: var(--gold); color: #24182f; }
.btn:focus-visible, .opt:focus-visible, .back:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* preguntas */
.section-tag { display: flex; align-items: center; gap: 10px; }
.section-tag::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.q { font-family: var(--display); font-size: 1.85rem; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 15px 16px; display: flex; gap: 12px; align-items: baseline;
  transition: border-color .15s, background .15s;
}
.opt b { font-family: var(--display); color: var(--gold); font-size: 1.1rem; font-weight: 600; min-width: 1em; }
.opt:hover { border-color: var(--muted); }
.opt.sel { border-color: var(--gold); background: #2b2340; }
.interlude { font-family: var(--display); font-style: italic; font-size: 1.35rem; color: var(--muted); }

/* formulario */
label { font-size: .9rem; color: var(--muted); display: block; margin-bottom: 6px; }
input {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px;
}
.err { color: #f2a5a5; font-size: .85rem; min-height: 1.2em; }

/* resultado */
.reveal { display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center; }
.card {
  width: 112px; aspect-ratio: 2 / 3.4; max-width: 100%; border-radius: 10px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--gold);
  display: grid; place-items: center; text-align: center; font-family: var(--display); color: var(--gold); padding: 8px;
}
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card:has(img) { padding: 0; }
.reveal > div { min-width: 0; }
.arq { font-size: 2.2rem; }
.sig { font-style: italic; font-family: var(--display); font-size: 1.15rem; color: var(--muted); }
.teaser { position: relative; }
.teaser .fade { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); }
.offers { display: grid; gap: 12px; }
.offer { border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.offer.featured { border-color: var(--gold); }
.offer-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.offer h3 { font-size: 1.45rem; }
.price { font-family: var(--display); font-size: 1.9rem; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.offer ul { margin: 0; padding-left: 1.1em; color: var(--muted); font-size: .92rem; display: grid; gap: 4px; }
.badge { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: #24182f; background: var(--gold); border-radius: 999px; padding: 3px 9px; font-weight: 600; align-self: flex-start; }
.demo { font-size: .82rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; }
.demo button { background: none; border: 0; color: var(--gold); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.full p + p { margin-top: 12px; }
.block { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.block h3 { font-size: 1.4rem; color: var(--gold); }

.screen { animation: in .35s ease both; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .progress > i { transition: none; } }
@media (max-width: 380px) { .reveal { grid-template-columns: 1fr; } .card { width: 120px; } h1 { font-size: 2.2rem; } .q { font-size: 1.6rem; } }
</style>

<script>
const DATA = {"version": 2, "fecha": "2026-10-22", "titulo": "Test de Alma", "descripcion": "Respondé con lo primero que sientas. No hay respuestas correctas ni incorrectas.", "datos_usuario": {"momento": "al final, antes de mostrar el resultado", "campos": ["nombre", "email"]}, "aviso": "Este test es una herramienta de reflexión personal y no reemplaza la ayuda de un profesional. Si estás atravesando un momento muy difícil, buscá apoyo en una línea de ayuda de tu país.", "secciones": [{"id": "estado-actual", "nombre": "Tu momento actual", "intro": "Respondé con lo primero que sientas. No hay respuestas correctas.", "preguntas": [{"id": 1, "texto": "Si tu alma pudiera hablar hoy, ¿qué diría primero?", "opciones": [{"texto": "Necesito una pausa.", "arquetipos": [4, 17]}, {"texto": "Nadie ve todo lo que hago.", "arquetipos": [5, 16]}, {"texto": "Quiero entender para qué me pasa esto.", "arquetipos": [1, 10]}, {"texto": "Quiero empezar de nuevo.", "arquetipos": [11, 20]}]}, {"id": 2, "texto": "Cuando te despertás de madrugada, ¿qué aparece primero?", "opciones": [{"texto": "Algo que hice y no me perdono.", "arquetipos": [7, 19]}, {"texto": "Una sensación de soledad.", "arquetipos": [5, 9]}, {"texto": "Una pregunta sobre el sentido de todo.", "arquetipos": [1, 22]}, {"texto": "Pendientes y personas que dependen de mí.", "arquetipos": [3, 16]}]}, {"id": 3, "texto": "¿Qué te pesa más hoy?", "opciones": [{"texto": "El cansancio.", "arquetipos": [4, 6]}, {"texto": "Una tristeza que no sé explicar.", "arquetipos": [9, 21]}, {"texto": "La incertidumbre.", "arquetipos": [8, 17]}, {"texto": "Algo que no puedo dejar ir.", "arquetipos": [15, 7]}]}, {"id": 4, "texto": "Si tuvieras que describir este momento con una palabra, ¿cuál sería?", "opciones": [{"texto": "Transición.", "arquetipos": [11, 17]}, {"texto": "Búsqueda.", "arquetipos": [1, 20]}, {"texto": "Agotamiento.", "arquetipos": [4, 2]}, {"texto": "Espera.", "arquetipos": [8, 10]}]}]}, {"id": "vinculos", "nombre": "Tus vínculos", "intro": "Ahora vamos a mirar cómo te relacionás con los demás.", "preguntas": [{"id": 5, "texto": "Cuando alguien te cuenta un problema, ¿qué hacés primero?", "opciones": [{"texto": "Busco cómo resolverlo.", "arquetipos": [3, 6]}, {"texto": "Escucho en silencio.", "arquetipos": [10, 2]}, {"texto": "Lo acompaño, aunque yo también esté mal.", "arquetipos": [2, 16]}, {"texto": "Comparto algo mío para que no se sienta aparte.", "arquetipos": [12, 9]}]}, {"id": 6, "texto": "¿Qué es lo que más te frustra de tus vínculos?", "opciones": [{"texto": "Dar más de lo que recibo.", "arquetipos": [2, 16]}, {"texto": "No poder decir lo que siento.", "arquetipos": [5, 10]}, {"texto": "Que la gente se aleje.", "arquetipos": [9, 15]}, {"texto": "Tener que ser siempre quien sostiene todo.", "arquetipos": [3, 6]}]}, {"id": 7, "texto": "¿Qué es lo que más te cuesta pedir?", "opciones": [{"texto": "Ayuda.", "arquetipos": [3, 6]}, {"texto": "Perdón.", "arquetipos": [19, 7]}, {"texto": "Tiempo para mí.", "arquetipos": [4, 16]}, {"texto": "Un abrazo.", "arquetipos": [9, 5]}]}, {"id": 8, "texto": "¿Qué te gustaría que los demás entendieran de vos?", "opciones": [{"texto": "Que no soy tan fuerte como parezco.", "arquetipos": [3, 21]}, {"texto": "Que necesito más de lo que digo.", "arquetipos": [5, 9]}, {"texto": "Que estoy haciendo lo mejor que puedo.", "arquetipos": [20, 19]}, {"texto": "Que necesito mi espacio.", "arquetipos": [4, 11]}]}]}, {"id": "mundo-interior", "nombre": "Tu mundo interior", "intro": "Ahora vamos a mirar lo que sentís por dentro.", "preguntas": [{"id": 9, "texto": "¿Qué es lo que más te cuesta perdonarte?", "opciones": [{"texto": "Haber lastimado a alguien.", "arquetipos": [7, 19]}, {"texto": "No haber hecho lo suficiente.", "arquetipos": [16, 6]}, {"texto": "Haberme dejado de lado.", "arquetipos": [21, 9]}, {"texto": "Haber callado lo que sentía.", "arquetipos": [5, 10]}]}, {"id": 10, "texto": "¿Qué extrañás de vos?", "opciones": [{"texto": "La alegría espontánea.", "arquetipos": [9, 18]}, {"texto": "La confianza en la gente.", "arquetipos": [21, 12]}, {"texto": "La fe en que todo tiene sentido.", "arquetipos": [22, 8]}, {"texto": "La energía para hacer cosas.", "arquetipos": [4, 20]}]}, {"id": 11, "texto": "¿Qué te hace sentir con vida?", "opciones": [{"texto": "Crear algo.", "arquetipos": [18, 11]}, {"texto": "Ayudar a alguien.", "arquetipos": [2, 16]}, {"texto": "Aprender algo nuevo.", "arquetipos": [1, 10]}, {"texto": "Un momento de calma en la naturaleza.", "arquetipos": [12, 18]}]}, {"id": 12, "texto": "¿Qué es lo que más te cuesta aceptar de la vida?", "opciones": [{"texto": "Que no puedo controlar todo.", "arquetipos": [17, 3]}, {"texto": "Que algunas cosas no van a volver.", "arquetipos": [15, 11]}, {"texto": "Que a veces necesito ayuda.", "arquetipos": [6, 21]}, {"texto": "Que todo tiene su tiempo.", "arquetipos": [8, 20]}]}]}, {"id": "futuro", "nombre": "Lo que viene", "intro": "Ahora vamos a mirar hacia adelante.", "preguntas": [{"id": 13, "texto": "Si pudieras hablar con quien eras hace 10 años, ¿qué le dirías?", "opciones": [{"texto": "\"Todo va a estar bien.\"", "arquetipos": [17, 12]}, {"texto": "\"No te exijas tanto.\"", "arquetipos": [19, 4]}, {"texto": "\"Confiá en tu intuición.\"", "arquetipos": [10, 22]}, {"texto": "\"Animate, aunque tengas miedo.\"", "arquetipos": [1, 20]}]}, {"id": 14, "texto": "¿Qué te da miedo del futuro?", "opciones": [{"texto": "Que nada cambie.", "arquetipos": [8, 11]}, {"texto": "Perder a alguien que amo.", "arquetipos": [16, 15]}, {"texto": "No estar a la altura.", "arquetipos": [19, 6]}, {"texto": "No saber qué va a pasar.", "arquetipos": [17, 1]}]}, {"id": 15, "texto": "¿Qué te da esperanza?", "opciones": [{"texto": "Ver que otros superaron algo parecido.", "arquetipos": [20, 12]}, {"texto": "Un momento de belleza inesperado.", "arquetipos": [18, 9]}, {"texto": "Una intuición de que algo bueno viene.", "arquetipos": [8, 22]}, {"texto": "Las personas que me quieren.", "arquetipos": [18, 2]}]}, {"id": 16, "texto": "Si recibieras un mensaje ahora mismo, ¿qué te gustaría que dijera?", "opciones": [{"texto": "\"Estás en el camino correcto.\"", "arquetipos": [20, 8]}, {"texto": "\"Hay alguien a tu lado.\"", "arquetipos": [12, 5]}, {"texto": "\"Ya podés soltar.\"", "arquetipos": [15, 7]}, {"texto": "\"Todo lo que sentís tiene sentido.\"", "arquetipos": [21, 1]}]}]}, {"id": "perdida", "nombre": "Pérdida", "intro": "Estas preguntas son solo para quienes perdieron a alguien importante.", "preguntas": [{"id": 17, "texto": "¿Perdiste a alguien importante en los últimos años?", "opciones": [{"texto": "Sí, a una persona.", "arquetipos": []}, {"texto": "Sí, a una mascota.", "arquetipos": []}, {"texto": "Sí, a una persona y a una mascota.", "arquetipos": []}, {"texto": "No.", "arquetipos": []}]}, {"id": 18, "texto": "Cuando pensás en quien partió, ¿qué sentís primero?", "opciones": [{"texto": "Nostalgia por lo que vivimos.", "arquetipos": [13, 18]}, {"texto": "Culpa por algo que quedó pendiente.", "arquetipos": [7, 19]}, {"texto": "Paz, aunque duela.", "arquetipos": [15, 21]}, {"texto": "Un vacío que no se llena.", "arquetipos": [14, 5]}]}, {"id": 19, "texto": "¿Creés que hay algo después de esta vida?", "opciones": [{"texto": "Sí, creo que nos vamos a reencontrar.", "arquetipos": [22, 14]}, {"texto": "No lo sé, pero me gusta pensarlo.", "arquetipos": [8, 13]}, {"texto": "No lo sé, y eso me duele.", "arquetipos": [15, 5]}, {"texto": "Creo que sigue vivo en lo que dejó en mí.", "arquetipos": [13, 22]}]}, {"id": 20, "texto": "¿Qué te gustaría que te dijera ahora?", "opciones": [{"texto": "\"Estoy bien, no te preocupes.\"", "arquetipos": [14, 17]}, {"texto": "\"Te perdono. Perdonate vos también.\"", "arquetipos": [19, 7]}, {"texto": "\"Estoy cerca, aunque no me veas.\"", "arquetipos": [22, 12]}, {"texto": "\"Gracias por todo lo que me diste.\"", "arquetipos": [13, 2]}]}, {"id": 21, "texto": "¿Qué te ayudaría a sentir más paz?", "opciones": [{"texto": "Saber que está en paz.", "arquetipos": [14, 22]}, {"texto": "Sentir que su recuerdo sigue vivo.", "arquetipos": [13, 9]}, {"texto": "Haber podido despedirme.", "arquetipos": [15, 7]}, {"texto": "Creer que nos vamos a reencontrar.", "arquetipos": [22, 14]}]}]}], "logica": [{"si": "pregunta 17 = 'No.'", "entonces": "saltar preguntas 18-21 y no mostrar 'mensaje_duelo'"}], "puntuacion": {"regla": "Cada opción elegida suma 1 punto a cada arquetipo que lista. Para cada arquetipo: puntuación = puntos / (n.º de preguntas respondidas que lo incluyen en alguna opción) ^ 0.55. Gana la más alta; empate = al azar entre los empatados. La pregunta 17 no suma puntos.", "exponente": 0.55}, "productos": {"basico": {"precio_usd_propuesto": 5, "incluye": ["arquetipo y carta", "texto completo", "mensaje extendido de la carta", "PDF"], "precio_ars": 7500}, "personalizado": {"precio_usd_propuesto": 19, "incluye": ["todo lo del básico", "audio del arquetipo", "audio personalizado por WhatsApp en ~48 h"], "precio_ars": 29000}}, "mensaje_duelo": "", "arquetipos": [{"id": 1, "nombre": "El Buscador", "carta": "El Loco", "significado": "El comienzo de un viaje. Confianza en lo desconocido.", "teaser": "Hay algo en vos que no se conforma con lo que ya sabe. Una parte de tu alma que sigue preguntando, que sigue buscando, que no se queda quieta con las respuestas fáciles. Y eso, aunque a veces te canse, es un regalo. No es que hayas perdido el rumbo. Estás buscando. Y buscar no es lo mismo que andar sin rumbo. Quien busca sabe que hay algo más. Quien busca intuye que la vida tiene capas que todavía no tocó. Y esa intuición tuya no es casualidad: es un llamado. "}, {"id": 2, "nombre": "El Sanador", "carta": "La Emperatriz", "significado": "Nutrición, cuidado, abundancia. Dar sin vaciarse.", "teaser": "Hay algo en vos que te lleva a cuidar a los demás. A escuchar. A acompañar. A estar presente incluso cuando vos necesitarías que alguien esté presente para vos. Y eso, aunque es un regalo, también es un function score() {
  const pts = {}, avail = {};
  for (const q of visible()) {
    const a = answers[q.id];
    if (a === undefined) continue;
    const present = new Set(q.opciones.flatMap(o => o.arquetipos));
    present.forEach(id => avail[id] = (avail[id] || 0) + 1);
    q.opciones[a].arquetipos.forEach(id => pts[id] = (pts[id] || 0) + 1);
  }
  const exp = DATA.puntuacion.exponente;
  let best = -1, winners = [];
  for (const id in avail) {
    const s = (pts[id] || 0) / Math.pow(avail[id], exp);
    if (s > best + 1e-9) { best = s; winners = [+id]; }
    else if (Math.abs(s - best) < 1e-9) winners.push(+id);
  }
  // desempate estable: el mismo set de respuestas siempre da el mismo arquetipo
  const seed = Object.values(answers).join("").split("").reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  return DATA.arquetipos.find(a => a.id === winners[seed % winners.length]);
}

  if (producto === "personalizado") {
    d.innerHTML = `<form id="wa" class="stack" style="gap:10px" novalidate>
      <label for="tel">Tu WhatsApp, con código de país (ej. +54 9 11 1234 5678)</label>
      <input id="tel" type="tel" autocomplete="tel" inputmode="tel">
      <p class="err" id="werr"></p>
      <button class="btn gold" type="submit">Ir a pagar con Mercado Pago</button></form>`;
    document.getElementById("wa").addEventListener("submit", e => {
      e.preventDefault();
      const tel = document.getElementById("tel").value.trim();
      if (tel.replace(/\D/g, "").length < 8) { document.getElementById("werr").textContent = "Revisá el número: necesitamos tu WhatsApp para enviarte el audio."; return; }
      pagar(producto, tel);
    });
    document.getElementById("tel").focus();
  } else pagar(producto, "");
  d.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function pagar(producto, telefono) {
  const d = document.getElementById("demo");
  d.textContent = "Preparando tu pago…";
  store.set("alma", { answers, user, resultId: result.id });
  try {
    const r = await fetch(PAGOS.endpoint, { method: "POST", body: JSON.stringify({
      accion: "crear", producto, nombre: user.nombre, email: user.email, telefono,
      arquetipo_id: result.id, perdida: hadLoss(), respuestas: answers }) });
    const j = await r.json();
    if (!j.url) throw new Error(j.error || "sin url");
    location.href = j.url;
  } catch (e) {
    d.textContent = "No pudimos abrir Mercado Pago. Revisá tu conexión e intentá de nuevo en unos segundos.";
  }
}

function fullResult(a) {
  const F = paid || a;
  const duelo = paid ? paid.mensaje_duelo : (hadLoss() ? DATA.mensaje_duelo : "");
  const paras = F.texto.split(/(?<=[.!?]["”]?)\s+(?=[A-ZÁÉÍÓÚÑ¿"“])/).reduce((acc, s, i) => {
    const k = Math.floor(i / 4); (acc[k] = acc[k] || []).push(s); return acc;
  }, []).map(g => `<p>${esc(g.join(" "))}</p>`).join("");
  return `
    <div class="full stack" style="gap:0">${paras}</div>
    <div class="block"><span class="eyebrow">El mensaje de tu carta</span><h3>${esc(a.carta)}</h3><p>${esc(F.mensaje_extendido)}</p></div>
    ${duelo ? `<div class="block"><span class="eyebrow">Para quien partió</span><p>${esc(duelo)}</p></div>` : ""}
    <p class="notice">${esc(DATA.aviso)}</p>
    <button class="btn ghost" id="again">Hacer el test otra vez</button>`;
}

async function traerResultado(intento) {
  const qs = new URLSearchParams(location.search);
  const d = document.getElementById("demo");
  d.hidden = false;
  d.textContent = "Confirmando tu pago con Mercado Pago…";
  try {
    const url = PAGOS.endpoint + "?accion=resultado&ref=" + encodeURIComponent(qs.get("ref") || "") + "&payment_id=" + encodeURIComponent(qs.get("payment_id") || "");
    const j = await (await fetch(url)).json();
    if (j.estado === "pagado") {
      paid = j; unlocked = true; render();
      const n = document.createElement("p");
      n.className = "demo"; n.textContent = "Pago recibido. También te enviamos este mensaje en PDF a " + user.email + ".";
      app.firstElementChild.insertBefore(n, app.firstElementChild.children[1]);
      return;
    }
  } catch (e) {}
  if (intento < 5) return setTimeout(() => traerResultado(intento + 1), 3000);
  d.textContent = "Tu pago se está procesando. En cuanto Mercado Pago lo confirme, te enviamos el mensaje completo por email a " + user.email + ".";
}

// Vuelta desde Mercado Pago: ?pago=ok / pendiente / error
(function () {
  const pago = new URLSearchParams(location.search).get("pago");
  const saved = pago && store.get("alma");
  if (saved) {
    Object.assign(answers, saved.answers); user = saved.user;
    result = DATA.arquetipos.find(a => a.id === saved.resultId);
    unlocked = pago === "ok" && !PAGOS.endpoint; step = "result";
  }
  render();
  if (saved && pago === "ok" && PAGOS.endpoint) return traerResultado(1);
  if (saved && pago !== "ok") {
    const d = document.getElementById("demo");
    d.hidden = false;
    d.textContent = pago === "pendiente" ? "Tu pago está pendiente. Cuando Mercado Pago lo confirme, te enviamos el mensaje por email." : "El pago no se completó. Podés intentarlo de nuevo.";
  }
  if (saved && pago === "ok" && !PAGOS.endpoint) {
    const n = document.createElement("p");
    n.className = "demo"; n.textContent = "Pago recibido. También te enviamos este mensaje en PDF a " + user.email + ".";
    app.firstElementChild.insertBefore(n, app.firstElementChild.children[1]);
  }
})();
</script>
