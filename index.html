<style>
/* Layout: una sola columna estrecha, una pregunta por pantalla, como una carta sobre la mesa de noche */
:root {
  --night: #15111f;
  --surface: #211b30;
  --line: #3a3150;
  --ink: #efe9f6;
  --muted: #a99fbd;
  --gold: #e8c46c;
  --violet: #7a3aa6;
  --violet-hi: #9150c0;
  --display: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  min-height: 100%;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 20px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.6rem; }
h2 { font-size: 1.9rem; }
p { margin: 0; }
.eyebrow { font-size: .75rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* barra superior */
.top { display: flex; align-items: center; gap: 12px; min-height: 40px; }
.back { background: none; border: 0; color: var(--muted); font: inherit; font-size: .9rem; padding: 8px 4px; cursor: pointer; }
.back:disabled { visibility: hidden; }
.progress { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .35s ease; }
.count { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 3.2em; text-align: right; }

/* portada */
.cover { border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.notice { font-size: .82rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }

/* botones */
.btn {
  appearance: none; border: 0; border-radius: 999px; cursor: pointer;
  background: var(--violet); color: #fff; font: inherit; font-weight: 600;
  padding: 15px 22px; width: 100%; transition: background .2s;
}
.btn:hover { background: var(--violet-hi); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.gold { background: var(--gold); color: #24182f; }
.btn:focus-visible, .opt:focus-visible, .back:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

/* preguntas */
.section-tag { display: flex; align-items: center; gap: 10px; }
.section-tag::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.q { font-family: var(--display); font-size: 1.85rem; font-weight: 600; line-height: 1.2; text-wrap: balance; }
.opts { display: grid; gap: 10px; }
.opt {
  text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 15px 16px; display: flex; gap: 12px; align-items: baseline;
  transition: border-color .15s, background .15s;
}
.opt b { font-family: var(--display); color: var(--gold); font-size: 1.1rem; font-weight: 600; min-width: 1em; }
.opt:hover { border-color: var(--muted); }
.opt.sel { border-color: var(--gold); background: #2b2340; }
.interlude { font-family: var(--display); font-style: italic; font-size: 1.35rem; color: var(--muted); }

/* formulario */
label { font-size: .9rem; color: var(--muted); display: block; margin-bottom: 6px; }
input {
  width: 100%; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px; padding: 13px 14px;
}
.err { color: #f2a5a5; font-size: .85rem; min-height: 1.2em; }

/* resultado */
.reveal { display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center; }
.card {
  width: 112px; aspect-ratio: 2 / 3.4; max-width: 100%; border-radius: 10px; overflow: hidden;
  background: var(--surface); border: 1px solid var(--gold);
  display: grid; place-items: center; text-align: center; font-family: var(--display); color: var(--gold); padding: 8px;
}
.card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card:has(img) { padding: 0; }
.reveal > div { min-width: 0; }
.arq { font-size: 2.2rem; }
.sig { font-style: italic; font-family: var(--display); font-size: 1.15rem; color: var(--muted); }
.teaser { position: relative; }
.teaser .fade { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 40%, transparent); mask-image: linear-gradient(#000 40%, transparent); }
.offers { display: grid; gap: 12px; }
.offer { border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.offer.featured { border-color: var(--gold); }
.offer-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.offer h3 { font-size: 1.45rem; }
.price { font-family: var(--display); font-size: 1.9rem; color: var(--gold); font-variant-numeric: tabular-nums; white-space: nowrap; }
.offer ul { margin: 0; padding-left: 1.1em; color: var(--muted); font-size: .92rem; display: grid; gap: 4px; }
.badge { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: #24182f; background: var(--gold); border-radius: 999px; padding: 3px 9px; font-weight: 600; align-self: flex-start; }
.demo { font-size: .82rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 12px 14px; }
.demo button { background: none; border: 0; color: var(--gold); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
.full p + p { margin-top: 12px; }
.block { border-top: 1px solid var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 10px; }
.block h3 { font-size: 1.4rem; color: var(--gold); }

.screen { animation: in .35s ease both; }
@keyframes in { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen { animation: none; } .progress > i { transition: none; } }
@media (max-width: 380px) { .reveal { grid-template-columns: 1fr; } .card { width: 120px; } h1 { font-size: 2.2rem; } .q { font-size: 1.6rem; } }
</style>

</head>

<script>
const DATA = {"version": 2, "fecha": "2026-10-22", "titulo": "Test de Alma", "descripcion": "Respondé con lo primero que sientas. No hay respuestas correctas ni incorrectas.", "datos_usuario": {"momento": "al final, antes de mostrar el resultado", "campos": ["nombre", "email"]}, "aviso": "Este test es una herramienta de reflexión personal y no reemplaza la ayuda de un profesional. Si estás atravesando un momento muy difícil, buscá apoyo en una línea de ayuda de tu país.", "secciones": [{"id": "estado-actual", "nombre": "Tu momento actual", "intro": "Respondé con lo primero que sientas. No hay respuestas correctas.", "preguntas": [{"id": 1, "texto": "Si tu alma pudiera hablar hoy, ¿qué diría primero?", "opciones": [{"texto": "Necesito una pausa.", "arquetipos": [4, 17]}, {"texto": "Nadie ve todo lo que hago.", "arquetipos": [5, 16]}, {"texto": "Quiero entender para qué me pasa esto.", "arquetipos": [1, 10]}, {"texto": "Quiero empezar de nuevo.", "arquetipos": [11, 20]}]}, {"id": 2, "texto": "Cuando te despertás de madrugada, ¿qué aparece primero?", "opciones": [{"texto": "Algo que hice y no me perdono.", "arquetipos": [7, 19]}, {"texto": "Una sensación de soledad.", "arquetipos": [5, 9]}, {"texto": "Una pregunta sobre el sentido de todo.", "arquetipos": [1, 22]}, {"texto": "Pendientes y personas que dependen de mí.", "arquetipos": [3, 16]}]}, {"id": 3, "texto": "¿Qué te pesa más hoy?", "opciones": [{"texto": "El cansancio.", "arquetipos": [4, 6]}, {"texto": "Una tristeza que no sé explicar.", "arquetipos": [9, 21]}, {"texto": "La incertidumbre.", "arquetipos": [8, 17]}, {"texto": "Algo que no puedo dejar ir.", "arquetipos": [15, 7]}]}, {"id": 4, "texto": "Si tuvieras que describir este momento con una palabra, ¿cuál sería?", "opciones": [{"texto": "Transición.", "arquetipos": [11, 17]}, {"texto": "Búsqueda.", "arquetipos": [1, 20]}, {"texto": "Agotamiento.", "arquetipos": [4, 2]}, {"texto": "Espera.", "arquetipos": [8, 10]}]}]}, {"id": "vinculos", "nombre": "Tus vínculos", "intro": "Ahora vamos a mirar cómo te relacionás con los demás.", "preguntas": [{"id": 5, "texto": "Cuando alguien te cuenta un problema, ¿qué hacés primero?", "opciones": [{"texto": "Busco cómo resolverlo.", "arquetipos": [3, 6]}, {"texto": "Escucho en silencio.", "arquetipos": [10, 2]}, {"texto": "Lo acompaño, aunque yo también esté mal.", "arquetipos": [2, 16]}, {"texto": "Comparto algo mío para que no se sienta aparte.", "arquetipos": [12, 9]}]}, {"id": 6, "texto": "¿Qué es lo que más te frustra de tus vínculos?", "opciones": [{"texto": "Dar más de lo que recibo.", "arquetipos": [2, 16]}, {"texto": "No poder decir lo que siento.", "arquetipos": [5, 10]}, {"texto": "Que la gente se aleje.", "arquetipos": [9, 15]}, {"texto": "Tener que ser siempre quien sostiene todo.", "arquetipos": [3, 6]}]}, {"id": 7, "texto": "¿Qué es lo que más te cuesta pedir?", "opciones": [{"texto": "Ayuda.", "arquetipos": [3, 6]}, {"texto": "Perdón.", "arquetipos": [19, 7]}, {"texto": "Tiempo para mí.", "arquetipos": [4, 16]}, {"texto": "Un abrazo.", "arquetipos": [9, 5]}]}, {"id": 8, "texto": "¿Qué te gustaría que los demás entendieran de vos?", "opciones": [{"texto": "Que no soy tan fuerte como parezco.", "arquetipos": [3, 21]}, {"texto": "Que necesito más de lo que digo.", "arquetipos": [5, 9]}, {"texto": "Que estoy haciendo lo mejor que puedo.", "arquetipos": [20, 19]}, {"texto": "Que necesito mi espacio.", "arquetipos": [4, 11]}]}]}, {"id": "mundo-interior", "nombre": "Tu mundo interior", "intro": "Ahora vamos a mirar lo que sentís por dentro.", "preguntas": [{"id": 9, "texto": "¿Qué es lo que más te cuesta perdonarte?", "opciones": [{"texto": "Haber lastimado a alguien.", "arquetipos": [7, 19]}, {"texto": "No haber hecho lo suficiente.", "arquetipos": [16, 6]}, {"texto": "Haberme dejado de lado.", "arquetipos": [21, 9]}, {"texto": "Haber callado lo que sentía.", "arquetipos": [5, 10]}]}, {"id": 10, "texto": "¿Qué extrañás de vos?", "opciones": [{"texto": "La alegría espontánea.", "arquetipos": [9, 18]}, {"texto": "La confianza en la gente.", "arquetipos": [21, 12]}, {"texto": "La fe en que todo tiene sentido.", "arquetipos": [22, 8]}, {"texto": "La energía para hacer cosas.", "arquetipos": [4, 20]}]}, {"id": 11, "texto": "¿Qué te hace sentir con vida?", "opciones": [{"texto": "Crear algo.", "arquetipos": [18, 11]}, {"texto": "Ayudar a alguien.", "arquetipos": [2, 16]}, {"texto": "Aprender algo nuevo.", "arquetipos": [1, 10]}, {"texto": "Un momento de calma en la naturaleza.", "arquetipos": [12, 18]}]}, {"id": 12, "texto": "¿Qué es lo que más te cuesta aceptar de la vida?", "opciones": [{"texto": "Que no puedo controlar todo.", "arquetipos": [17, 3]}, {"texto": "Que algunas cosas no van a volver.", "arquetipos": [15, 11]}, {"texto": "Que a veces necesito ayuda.", "arquetipos": [6, 21]}, {"texto": "Que todo tiene su tiempo.", "arquetipos": [8, 20]}]}]}, {"id": "futuro", "nombre": "Lo que viene", "intro": "Ahora vamos a mirar hacia adelante.", "preguntas": [{"id": 13, "texto": "Si pudieras hablar con quien eras hace 10 años, ¿qué le dirías?", "opciones": [{"texto": "\"Todo va a estar bien.\"", "arquetipos": [17, 12]}, {"texto": "\"No te exijas tanto.\"", "arquetipos": [19, 4]}, {"texto": "\"Confiá en tu intuición.\"", "arquetipos": [10, 22]}, {"texto": "\"Animate, aunque tengas miedo.\"", "arquetipos": [1, 20]}]}, {"id": 14, "texto": "¿Qué te da miedo del futuro?", "opciones": [{"texto": "Que nada cambie.", "arquetipos": [8, 11]}, {"texto": "Perder a alguien que amo.", "arquetipos": [16, 15]}, {"texto": "No estar a la altura.", "arquetipos": [19, 6]}, {"texto": "No saber qué va a pasar.", "arquetipos": [17, 1]}]}, {"id": 15, "texto": "¿Qué te da esperanza?", "opciones": [{"texto": "Ver que otros superaron algo parecido.", "arquetipos": [20, 12]}, {"texto": "Un momento de belleza inesperado.", "arquetipos": [18, 9]}, {"texto": "Una intuición de que algo bueno viene.", "arquetipos": [8, 22]}, {"texto": "Las personas que me quieren.", "arquetipos": [18, 2]}]}, {"id": 16, "texto": "Si recibieras un mensaje ahora mismo, ¿qué te gustaría que dijera?", "opciones": [{"texto": "\"Estás en el camino correcto.\"", "arquetipos": [20, 8]}, {"texto": "\"Hay alguien a tu lado.\"", "arquetipos": [12, 5]}, {"texto": "\"Ya podés soltar.\"", "arquetipos": [15, 7]}, {"texto": "\"Todo lo que sentís tiene sentido.\"", "arquetipos": [21, 1]}]}]}, {"id": "perdida", "nombre": "Pérdida", "intro": "Estas preguntas son solo para quienes perdieron a alguien importante.", "preguntas": [{"id": 17, "texto": "¿Perdiste a alguien importante en los últimos años?", "opciones": [{"texto": "Sí, a una persona.", "arquetipos": []}, {"texto": "Sí, a una mascota.", "arquetipos": []}, {"texto": "Sí, a una persona y a una mascota.", "arquetipos": []}, {"texto": "No.", "arquetipos": []}]}, {"id": 18, "texto": "Cuando pensás en quien partió, ¿qué sentís primero?", "opciones": [{"texto": "Nostalgia por lo que vivimos.", "arquetipos": [13, 18]}, {"texto": "Culpa por algo que quedó pendiente.", "arquetipos": [7, 14]}, {"texto": "Paz, aunque duela.", "arquetipos": [15, 21]}, {"texto": "Un vacío que no se llena.", "arquetipos": [14, 5]}]}, {"id": 19, "texto": "¿Creés que hay algo después de esta vida?", "opciones": [{"texto": "Sí, creo que nos vamos a reencontrar.", "arquetipos": [22, 14]}, {"texto": "No lo sé, pero me gusta pensarlo.", "arquetipos": [8, 13]}, {"texto": "No lo sé, y eso me duele.", "arquetipos": [15, 5]}, {"texto": "Creo que sigue vivo en lo que dejó en mí.", "arquetipos": [13, 22]}]}, {"id": 20, "texto": "¿Qué te gustaría que te dijera ahora?", "opciones": [{"texto": "\"Estoy bien, no te preocupes.\"", "arquetipos": [14, 17]}, {"texto": "\"Te perdono. Perdonate vos también.\"", "arquetipos": [19, 7]}, {"texto": "\"Estoy cerca, aunque no me veas.\"", "arquetipos": [22, 12]}, {"texto": "\"Gracias por todo lo que me diste.\"", "arquetipos": [13, 2]}]}, {"id": 21, "texto": "¿Qué te ayudaría a sentir más paz?", "opciones": [{"texto": "Saber que está en paz.", "arquetipos": [14, 22]}, {"texto": "Sentir que su recuerdo sigue vivo.", "arquetipos": [13, 9]}, {"texto": "Haber podido despedirme.", "arquetipos": [15, 7]}, {"texto": "Creer que nos vamos a reencontrar.", "arquetipos": [22, 14]}]}]}], "logica": [{"si": "pregunta 17 = 'No.'", "entonces": "saltar preguntas 18-21 y no mostrar 'mensaje_duelo'"}], "puntuacion": {"regla": "Cada opción elegida suma 1 punto a cada arquetipo que lista. Para cada arquetipo: puntuación = puntos / (n.º de preguntas respondidas que lo incluyen en alguna opción) ^ 0.55. Gana la más alta; empate = al azar entre los empatados. La pregunta 17 no suma puntos.", "exponente": 0.55}, "productos": {"basico": {"precio_usd_propuesto": 5, "incluye": ["arquetipo y carta", "texto completo", "mensaje extendido de la carta", "PDF"], "precio_ars": 7500}, "personalizado": {"precio_usd_propuesto": 19, "incluye": ["todo lo del básico", "audio del arquetipo", "audio personalizado por WhatsApp en ~48 h"], "precio_ars": 29000}}, "mensaje_duelo": "Cada alma tiene su tiempo. El consuelo es difícil, pero la certeza de que nos reencontraremos es la mejor forma de canalizar esa energía. La espera no es eterna. La vida fluye, y es tu momento de vivir y vibrar en armonía. Los que no están, están. Te observan, te apoyan, te acompañan. Y la mejor forma de honrarlos es teniendo una buena vida.", "arquetipos": [{"id": 1, "nombre": "El Buscador", "carta": "El Loco", "significado": "El comienzo de un viaje. Confianza en lo desconocido.", "texto": "Hay algo en vos que no se conforma con lo que ya sabe. Una parte de tu alma que sigue preguntando, que sigue buscando, que no se queda quieta con las respuestas fáciles. Y eso, aunque a veces te canse, es un regalo. No estás perdido. Estás buscando. Y buscar no es lo mismo que estar perdido. El que busca sabe que hay algo más. El que busca intuye que la vida tiene capas que todavía no tocó. Y esa intuición tuya no es casualidad: es un llamado. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Es tu alma pidiéndote que sigas caminando, aunque no veas el final del camino. Tus respuestas dibujan el perfil de alguien que no se contenta con la superficie. Alguien que mira el cielo y se pregunta. Alguien que siente que hay algo más grande, aunque no siempre sepa nombrarlo. Muchas tradiciones espirituales hablan de los buscadores como almas que eligieron venir a esta vida a recordar, no a aprender. A recordar de dónde vienen. A recordar que hay un hilo que las conecta con algo más grande. Y vos, por tus respuestas, parecés ser una de esas almas. Los ángeles que te acompañan no te dan respuestas directas. No te dicen \"esto es así\". Te dan señales. Te ponen personas en el camino. Te hacen encontrar libros, canciones, conversaciones que llegan justo cuando las necesitás. Porque saben que tu alma no necesita que le digan qué hacer: necesita que le recuerden que ya sabe. Hay una imagen que aparece en tus respuestas: la de alguien parado en un cruce de caminos, mirando el horizonte. No está perdido. Está eligiendo. Y elegir, cuando se hace con el alma, es un acto sagrado. No estás perdido. Estás buscando. Y el que busca, ya está en el camino correcto. Esta semana, elegí un momento del día y hacete una sola pregunta: \"¿Qué es lo que mi alma está tratando de recordarme?\" No busques la respuesta con la mente. Dejala caer. Escribila si aparece. Y si no aparece, no te preocupes: la pregunta ya está haciendo su trabajo. No estás solo. Los ángeles que te acompañan no te van a dar un mapa, pero te van a dar señales. Están en las coincidencias, en los sueños, en las personas que aparecen justo cuando las necesitás. Seguí buscando. No estás perdido. Estás en el camino.", "mensaje_extendido": "El Loco te invita a dar el primer paso sin saber exactamente a dónde vas. Te recuerda que la fe no es certeza, sino confianza. Y que el camino se hace al andar. Cada vez que te animás a lo desconocido, el universo te abre una puerta. No necesitás tener todo resuelto. Solo necesitás animarte a empezar. Esta carta te dice que el viaje más importante es el que hacés hacia adentro. Y que, aunque parezca que estás solo, siempre hay alguien caminando a tu lado. Confiá. El camino se va a ir abriendo."}, {"id": 2, "nombre": "El Sanador", "carta": "La Emperatriz", "significado": "Nutrición, cuidado, abundancia. Dar sin vaciarse.", "texto": "Hay algo en vos que te lleva a cuidar a los demás. A escuchar. A sostener. A estar presente incluso cuando vos mismo necesitarías que alguien esté presente para vos. Y eso, aunque es un regalo, también es un peso. No estás solo. Y no tenés que sostener todo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que salves a nadie más. Necesita que te permitas ser salvado también. Tus respuestas dibujan el perfil de alguien que aprendió a sanar a otros desde su propia herida. Alguien que sabe escuchar porque alguna vez necesitó ser escuchado. Alguien que sabe acompañar porque alguna vez se sintió solo. Los ángeles que te acompañan no te piden que cargues con el dolor del mundo. Te piden que empieces por vos. Porque un sanador que no se sana a sí mismo termina vaciándose. Y vos no viniste a vaciarte. Viniste a fluir. Hay una imagen que aparece en tus respuestas: la de alguien sosteniendo una vela encendida para iluminar el camino de otros. Pero la vela se consume. Y si no se renueva, se apaga. Tu alma te pide que te permitas renovar tu propia luz. No tenés que salvarte a todos. A veces, el acto más sanador es permitirte ser cuidado. Esta semana, elegí un día para no cuidar a nadie. No para ser egoísta, sino para descansar. No ofrezcas ayuda. No resuelvas problemas. No sostengas. Solo estate. Y si aparece la culpa, respirá y decite: \"Esto también es parte de cuidarme.\" No estás solo. Los ángeles que te acompañan no te piden que seas fuerte todo el tiempo. Te piden que te permitas descansar. Cuidate. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Emperatriz te recuerda que el cuidado no es debilidad, sino poder. Te invita a nutrirte, a nutrir a otros, a dejar que la vida florezca a tu alrededor. Esta carta te dice que el amor que das no se pierde. Se multiplica. Y que vos también merecés ser nutrido. Permitite recibir. Permitite florecer. El universo te está invitando a crear, a dar a luz algo nuevo, a confiar en que lo que plantás va a crecer. Aunque no veas los frutos todavía, las raíces ya están trabajando."}, {"id": 3, "nombre": "El Guardián", "carta": "El Emperador", "significado": "Protección, estructura, liderazgo. Cuidar sin controlar.", "texto": "Hay algo en vos que te lleva a proteger. A sostener. A estar firme incluso cuando por dentro todo tiembla. Y eso, aunque es una forma de amor, también es una forma de soledad. No estás solo. Y no tenés que cargar todo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que seas fuerte todo el tiempo. Necesita que te permitas ser sostenido también. Tus respuestas dibujan el perfil de alguien que aprendió a sostener a otros desde muy temprano. Alguien que sabe proteger porque alguna vez necesitó protección. Alguien que sabe estar firme porque alguna vez se sintió frágil. Los ángeles que te acompañan no te piden que cargues con el peso del mundo. Te piden que empieces por vos. Porque un guardián que no se protege a sí mismo termina agotándose. Y vos no viniste a agotarte. Viniste a vivir. Hay una imagen que aparece en tus respuestas: la de alguien sosteniendo un techo para que otros pasen. Pero el techo pesa. Y si no se apoya en algo, se cae. Tu alma te pide que te permitas apoyarte también. No tenés que sostener todo para ser digno de amor. A veces, el acto más valiente es permitirte descansar. Esta semana, elegí un día para no sostener nada. No para ser irresponsable, sino para descansar. No resuelvas problemas. No te adelantes a lo que puede pasar. Solo estate. Y si aparece la culpa, respirá y decite: \"Esto también es parte de cuidarme.\" No estás solo. Los ángeles que te acompañan no te piden que seas fuerte todo el tiempo. Te piden que te permitas descansar. Descansá. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Emperador te recuerda que la protección no es control. Que cuidar no es dominar. Que sostener no es cargar con todo. Esta carta te invita a poner límites, a estructurar tu vida, a construir sobre bases firmes. Pero también te recuerda que el poder real no está en el control, sino en la confianza. Permitite liderar sin cargar. Permitite proteger sin controlar. Y permitite descansar. Porque un guardián que no descansa no puede sostener nada."}, {"id": 4, "nombre": "El Que Descansa", "carta": "El Colgado", "significado": "Pausa, rendición, ver desde otra perspectiva.", "texto": "Hay algo en vos que pide pausa. Una parte de tu alma que está cansada, no de vivir, sino de sostener. De sostener el ritmo, las expectativas, las responsabilidades, los silencios incómodos. Y ese cansancio no es debilidad: es una señal. No estás solo. Y no tenés que seguir a este ritmo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita más fuerza. Necesita más espacio. Tus respuestas dibujan el perfil de alguien que ha estado corriendo durante mucho tiempo. Alguien que ha sostenido mucho más de lo que ha recibido. Alguien que ha aprendido a aguantar, pero no a descansar. Los ángeles que te acompañan no te piden que sigas. Te piden que pares. Porque un alma agotada no puede escuchar las señales. Y vos necesitás escuchar. Necesitás descansar para volver a ver el camino. Hay una imagen que aparece en tus respuestas: la de un río que ha estado corriendo durante mucho tiempo, arrastrando piedras, ramas, todo lo que encuentra. Y en algún momento, el río necesita ensancharse, bajar la velocidad, dejar que el agua se asiente. No para dejar de ser río. Sino para volver a ver el fondo. Parar no es rendirse. Parar es elegir seguir viviendo. Esta semana, elegí un momento del día para hacer algo que no sirva para nada. No para producir, no para ayudar, no para resolver. Solo para vos. Puede ser mirar por la ventana, tomar un té sin apuro, escuchar una canción con los ojos cerrados. Si aparece la culpa, respirá y decite: \"Esto también es parte de cuidarme.\" No estás solo. Aunque ahora sientas que nadie ve lo que cargás, hay una parte de vos que sí te ve. Y hay algo más grande que vos que también te sostiene, incluso cuando no lo sentís. Descansá. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Colgado te invita a pausar. A rendirte. A ver desde otra perspectiva. Esta carta te dice que no todo se resuelve con acción. A veces, la respuesta llega cuando dejás de buscar. Cuando dejás de forzar. Cuando te permitís estar quieto. No estás perdiendo el tiempo. Estás dejando que el tiempo haga su trabajo. Permitite estar en pausa. Permitite no saber. Permitite que el misterio te habite. Y confiá en que, cuando menos lo esperes, la respuesta va a llegar."}, {"id": 5, "nombre": "El Corazón Invisible", "carta": "La Luna", "significado": "Misterio, emociones profundas, lo que no se ve.", "texto": "Hay algo en vos que siente que no es visto. Que no es escuchado. Que pasa desapercibido incluso cuando está dando todo. Y eso, aunque no lo digas, duele. No estás solo. Y no estás invisible. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que te vean para ser valiosa. Ya lo es. Pero necesita que vos te veas. Tus respuestas dibujan el perfil de alguien que ha aprendido a estar en silencio. Alguien que ha aprendido a no molestar. Alguien que ha aprendido a dar sin pedir. Y ese aprendizaje, aunque fue necesario en algún momento, ahora te pesa. Los ángeles que te acompañan no te piden que grites. Te piden que te escuches. Porque un alma que no se escucha a sí misma termina creyendo que no merece ser escuchada. Y vos merecés ser escuchado. Hay una imagen que aparece en tus respuestas: la de alguien parado en una habitación llena de gente, sintiéndose solo. Pero no está solo. Solo está desconectado de sí mismo. Y el camino de vuelta empieza por vos. No estás invisible. Estás desconectado de vos mismo. Y volver a vos es el primer paso para que los demás te vean. Esta semana, elegí un momento del día para escribir tres cosas que sentís. No para mostrárselas a nadie. Solo para vos. Puede ser una emoción, una necesidad, un deseo. Escribilas y leelas en voz alta. Y si aparece la vergüenza, respirá y decite: \"Esto también es parte de verme.\" No estás solo. Los ángeles que te acompañan te ven, aunque no lo sientas. Los guías que te cuidan te escuchan, aunque no lo sepas. Y los seres amados que te velan te acompañan, aunque no los veas. No estás invisible. Estás volviendo a vos.", "mensaje_extendido": "La Luna te invita a mirar lo que no se ve. A escuchar lo que no se dice. A confiar en lo que sentís aunque no puedas explicarlo. Esta carta te dice que hay una sabiduría en la oscuridad. Que las emociones más profundas no son un problema, son una guía. No te apures a salir de la noche. A veces, la noche es el lugar donde el alma descansa. Permitite sentir. Permitite no entender. Permitite que la luna te acompañe. Y confiá en que, aunque no veas el camino, estás siendo guiado."}, {"id": 6, "nombre": "El Luchador", "carta": "La Fuerza", "significado": "Valentía suave, resistencia, poder interior.", "texto": "Hay algo en vos que no se rinde. Que sigue adelante aunque duela. Que se levanta aunque esté cansado. Y eso, aunque es una forma de fuerza, también es una forma de agotamiento. No estás solo. Y no tenés que luchar todo el tiempo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que luches más. Necesita que descanses. Tus respuestas dibujan el perfil de alguien que ha aprendido a resistir. Alguien que ha aprendido a aguantar. Alguien que ha aprendido a seguir adelante incluso cuando todo parece perdido. Y esa resistencia, aunque te ha traído hasta acá, también te ha desgastado. Los ángeles que te acompañan no te piden que luches más. Te piden que confíes. Porque un alma que lucha todo el tiempo no puede escuchar las señales. Y vos necesitás escuchar. Hay una imagen que aparece en tus respuestas: la de alguien remando contra la corriente durante mucho tiempo. Pero en algún momento, el río cambia. Y el que sigue remando contra la corriente se agota sin darse cuenta de que ya podría estar fluyendo. No tenés que luchar todo el tiempo. A veces, el acto más valiente es soltar los remos y confiar. Esta semana, elegí un momento del día para no hacer nada. No para ser vago, sino para descansar. No resuelvas problemas. No te adelantes a lo que puede pasar. Solo estate. Y si aparece la culpa, respirá y decite: \"Esto también es parte de confiar.\" No estás solo. Los ángeles que te acompañan no te piden que luches más. Te piden que confíes. Descansá. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Fuerza te invita a confiar en tu poder interior. No en la fuerza bruta, sino en la fuerza suave. La que sostiene sin apretar. La que espera sin desesperar. La que resiste sin romperse. Esta carta te dice que ya tenés todo lo que necesitás. Que no necesitás ser más fuerte. Solo necesitás confiar en la fuerza que ya tenés. Permitite ser suave. Permitite ser paciente. Permitite ser valiente. Y confiá en que tu poder interior es más grande de lo que creés."}, {"id": 7, "nombre": "El Que Suelta", "carta": "La Templanza", "significado": "Equilibrio, paciencia, sanación lenta.", "texto": "Hay algo en vos que carga con un peso que no te corresponde. Una culpa. Un arrepentimiento. Algo que quedó pendiente y que todavía te pesa. Y eso, aunque es humano, también es agotador. No estás solo. Y no tenés que cargar con eso. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que te castigues. Necesita que te perdones. Tus respuestas dibujan el perfil de alguien que ha aprendido a cargar con la culpa. Alguien que se exige más de lo que se permite. Alguien que se juzga más de lo que se acepta. Y esa culpa, aunque parece justa, no te está ayudando. Los ángeles que te acompañan no te piden que te castigues. Te piden que te perdones. Porque un alma que no se perdona no puede avanzar. Y vos necesitás avanzar. Hay una imagen que aparece en tus respuestas: la de alguien cargando una mochila llena de piedras. Cada piedra es una culpa, un arrepentimiento, algo que no se perdonó. Y en algún momento, la mochila pesa tanto que ya no se puede caminar. Pero las piedras no son tuyas. Las cargaste porque creíste que debías. Y podés soltarlas. No tenés que cargar con la culpa para ser digno de amor. A veces, el acto más valiente es perdonarte. Esta semana, elegí un momento tranquilo y escribí una carta de perdón hacia vos mismo. No para justificar lo que hiciste. Para reconocer que hiciste lo mejor que pudiste con lo que tenías. Escribila a mano. Y si al terminarla sentís paz, aunque sea un poco, es señal de que estás soltando. No estás solo. Los ángeles que te acompañan no te piden que te castigues. Te piden que te perdones. Perdonate. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Templanza te invita a encontrar el equilibrio. A no apurarte. A confiar en el proceso. Esta carta te dice que la sanación no es lineal. Que hay días mejores y días peores. Y que ambos son parte del camino. No te exijas sanar de un día para el otro. Permitite ir despacio. Permitite mezclar. Permitite encontrar tu propio ritmo. Y confiá en que, aunque parezca que no avanzás, cada paso cuenta. Cada momento de paz cuenta. Cada respiración cuenta."}, {"id": 8, "nombre": "El Que Espera", "carta": "La Estrella", "significado": "Esperanza, fe, guía en la oscuridad.", "texto": "Hay algo en vos que espera. Una señal. Un cambio. Una respuesta. Algo que te diga que vas por buen camino. Y esa espera, aunque es humana, también es agotadora. No estás solo. Y no tenés que esperar para siempre. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que esperes. Necesita que confíes. Tus respuestas dibujan el perfil de alguien que ha aprendido a esperar. Alguien que ha aprendido a tener paciencia. Alguien que ha aprendido a confiar en que algo va a cambiar. Y esa espera, aunque es una forma de fe, también es una forma de detenerse. Los ángeles que te acompañan no te piden que esperes más. Te piden que confíes. Porque un alma que espera todo el tiempo no puede vivir el presente. Y vos necesitás vivir el presente. Hay una imagen que aparece en tus respuestas: la de alguien parado en una estación, esperando un tren que no llega. Pero el tren no es el único camino. Hay otros. Y a veces, el tren que esperamos no es el que necesitamos. No tenés que esperar para ser feliz. A veces, el acto más valiente es confiar en que lo que buscás ya está en camino. Esta semana, elegí un momento del día para hacer algo que te guste. No para distraerte de la espera, sino para recordarte que la vida también pasa mientras esperás. Puede ser caminar, leer, cocinar, escuchar música. Y si aparece la culpa, respirá y decite: \"Esto también es parte de confiar.\" No estás solo. Los ángeles que te acompañan no te piden que esperes más. Te piden que confíes. Confiá. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Estrella te invita a esperar. A confiar en que hay una luz que te guía, incluso en la oscuridad. Esta carta te dice que no estás solo. Que hay algo más grande que vos acompañándote. Que hay un propósito, aunque no lo veas. Permitite esperar. Permitite confiar. Permitite que la estrella te guíe. Y recordá que la espera no es eterna. La vida fluye. Y el reencuentro existe."}, {"id": 9, "nombre": "El Niño Interior", "carta": "El Sol", "significado": "Alegría, claridad, plenitud.", "texto": "Hay algo en vos que necesita ternura. Un niño interior que todavía espera ser consolado. Un niño interior que todavía espera ser visto. Y eso, aunque no lo digas, es una de las cosas que más te pesa. No estás solo. Y no tenés que consolarte solo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que seas fuerte. Necesita que te permitas ser cuidado. Tus respuestas dibujan el perfil de alguien que aprendió a crecer rápido. Alguien que aprendió a ser fuerte antes de tiempo. Alguien que aprendió a cuidarse solo porque no había otra opción. Y ese niño interior, aunque creció, todavía sigue ahí. Los ángeles que te acompañan no te piden que sigas siendo fuerte. Te piden que te permitas ser cuidado. Porque un alma que no se permite ser cuidada no puede descansar. Y vos necesitás descansar. Hay una imagen que aparece en tus respuestas: la de alguien abrazando a un niño que llora. Pero el que abraza y el que llora son la misma persona. Y en algún momento, hay que permitir que el niño sea consolado. No tenés que ser fuerte todo el tiempo. A veces, el acto más valiente es permitirte ser cuidado. Esta semana, elegí un momento tranquilo y escribí una carta a tu niño interior. Decile lo que necesitabas escuchar cuando eras chico. Decile que está a salvo. Decile que ya no está solo. Y si al terminarla sentís paz, aunque sea un poco, es señal de que estás sanando. No estás solo. Los ángeles que te acompañan no te piden que seas fuerte. Te piden que te permitas ser cuidado. Permitite ser cuidado. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Sol te invita a brillar. A confiar en tu luz. A permitirte ser visto. Esta carta te dice que la alegría no es un pecado. Que la plenitud no es egoísmo. Que tenés derecho a ser feliz. Permitite brillar. Permitite disfrutar. Permitite que la vida te sonría. Y recordá que tu luz no le quita luz a nadie. Al contrario, ilumina a todos los que te rodean."}, {"id": 10, "nombre": "El Sabio Silencioso", "carta": "El Ermitaño", "significado": "Introspección, sabiduría, luz interior.", "texto": "Hay algo en vos que ya sabe. Una parte de tu alma que intuye el camino, que conoce la respuesta, que sabe qué hacer. Pero no te animás. Y esa desconexión entre lo que sabés y lo que hacés es una de las cosas que más te pesa. No estás solo. Y no tenés que saberlo todo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita más información. Necesita que confíes en lo que ya sabe. Tus respuestas dibujan el perfil de alguien que ha aprendido a escuchar su intuición. Alguien que ha aprendido a confiar en su voz interior. Alguien que ha aprendido a saber sin saber cómo. Y esa sabiduría, aunque es un regalo, también es una responsabilidad. Los ángeles que te acompañan no te piden que sepas más. Te piden que confíes en lo que ya sabés. Porque un alma que sabe pero no se anima a actuar vive en una tensión constante. Y vos necesitás paz. Hay una imagen que aparece en tus respuestas: la de alguien parado frente a una puerta que sabe que tiene que abrir, pero no se anima. La puerta no está cerrada con llave. Solo está cerrada. Y abrirla depende de vos. Ya sabés lo que tenés que hacer. Solo necesitás animarte a hacerlo. Esta semana, elegí una cosa que sabés que tenés que hacer pero no te animás. No tiene que ser grande. Puede ser una conversación, un mensaje, una decisión. Hacela. Y si aparece el miedo, respirá y decite: \"Esto también es parte de confiar.\" No estás solo. Los ángeles que te acompañan no te piden que sepas más. Te piden que confíes en lo que ya sabés. Animate. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Ermitaño te invita a mirar hacia adentro. A confiar en tu voz interior. A encontrar tu propia luz. Esta carta te dice que no necesitás que otros te digan qué hacer. Que ya sabés. Que tu intuición es tu mejor guía. Permitite estar solo. Permitite escucharte. Permitite confiar en lo que sentís. Y recordá que la soledad no es castigo. Es un espacio sagrado donde el alma se encuentra a sí misma."}, {"id": 11, "nombre": "El Que Renace", "carta": "La Muerte", "significado": "Transformación, renacimiento, dejar atrás.", "texto": "Hay algo en vos que está muriendo. No vos, sino una versión de vos. Una versión que ya no te sirve. Una versión que ya no te representa. Y esa muerte, aunque duele, también es un nacimiento. No estás solo. Y no tenés que renacer solo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que te aferres a lo viejo. Necesita que confíes en lo nuevo. Tus respuestas dibujan el perfil de alguien que está en transición. Alguien que está dejando atrás algo que ya no le sirve. Alguien que está empezando a ser otro. Y esa transición, aunque es incómoda, es necesaria. Los ángeles que te acompañan no te piden que te apures. Te piden que confíes. Porque un alma en transición necesita tiempo para acomodarse. Y vos necesitás tiempo. Hay una imagen que aparece en tus respuestas: la de una oruga que se convierte en mariposa. Pero entre la oruga y la mariposa hay un momento de completa desintegración. La oruga no sabe que va a ser mariposa. Solo sabe que ya no puede ser oruga. Y en ese no saber, está el milagro. No estás perdiendo. Estás renaciendo. Y el renacimiento siempre empieza con una muerte. Esta semana, elegí un momento tranquilo y escribí una lista de cosas que querés dejar atrás. No para castigarte, sino para reconocer que ya no te sirven. Puede ser una creencia, un hábito, una relación, una versión de vos. Escribilas. Y si al terminarla sentís paz, aunque sea un poco, es señal de que estás renaciendo. No estás solo. Los ángeles que te acompañan no te piden que te apures. Te piden que confíes. Renacé. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Muerte te invita a soltar. A dejar atrás lo que ya no te sirve. A renacer. Esta carta te dice que no estás perdiendo. Estás transformándote. Que hay algo nuevo naciendo en vos. Aunque duela. Aunque no lo entiendas. Permitite soltar. Permitite morir a lo viejo. Permitite renacer. Y confiá en que lo que viene es mejor que lo que se fue."}, {"id": 12, "nombre": "El Conectado", "carta": "El Mundo", "significado": "Plenitud, regreso a casa, conexión con todo.", "texto": "Hay algo en vos que confía. Una parte de tu alma que sabe que no está sola, aunque a veces lo sienta. Una parte de tu alma que intuye que hay algo más grande, aunque no siempre lo vea. Y esa confianza, aunque es un regalo, también es un camino. No estás solo. Y no tenés que sentirte conectado todo el tiempo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que confíes más. Necesita que confíes en que ya está conectada. Tus respuestas dibujan el perfil de alguien que ha aprendido a confiar. Alguien que ha aprendido a ver señales. Alguien que ha aprendido a sentir que hay algo más grande acompañándolo. Y esa confianza, aunque es una forma de sabiduría, también es una forma de entrega. Los ángeles que te acompañan no te piden que confíes más. Te piden que confíes en que ya están con vos. Porque un alma que confía no necesita pruebas. Solo necesita recordar. Hay una imagen que aparece en tus respuestas: la de alguien caminando por un sendero iluminado por la luna. No está solo. La luz lo acompaña. Y aunque no ve el final del camino, sabe que no está perdido. No estás solo. Nunca lo estuviste. Solo necesitás recordar que ya estás conectado. Esta semana, elegí un momento del día para agradecer. No por algo específico, sino por estar acá. Agradecé el aire, el sol, la vida, las personas que amás, los que ya no están. Agradecé en voz alta si podés. Y si al terminarlo sentís paz, aunque sea un poco, es señal de que estás conectado. No estás solo. Los ángeles que te acompañan, los guías que te cuidan, los seres amados que te velan, todos están con vos. No para darte un mapa, sino para recordarte que ya estás en el camino. Confiá. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Mundo te invita a celebrar. A reconocer todo lo que has recorrido. A confiar en que estás volviendo a casa. Esta carta te dice que el viaje no termina acá. Que hay un hogar que te espera. Que hay un reencuentro que te aguarda. Permitite celebrar. Permitite agradecer. Permitite confiar. Y recordá que todo lo que viviste, lo bueno y lo malo, te trajo hasta acá. Y acá estás. Entero. Y en camino a casa."}, {"id": 13, "nombre": "El Que Recuerda", "carta": "El Juicio", "significado": "Despertar, memoria, llamado interior.", "texto": "Hay algo en vos que no quiere olvidar. Una parte de tu alma que se aferra a los recuerdos, a los momentos, a las personas y seres amados que ya no están. Y ese aferrarse, aunque es una forma de amor, también es una forma de dolor. No estás solo. Y no tenés que olvidar para estar bien. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que olvides. Necesita que recuerdes sin dolor. Tus respuestas dibujan el perfil de alguien que ha aprendido a honrar la memoria. Alguien que ha aprendido a mantener vivo el recuerdo. Alguien que ha aprendido a amar lo que ya no está. Y esa memoria, aunque es un regalo, también es una carga. Los ángeles que te acompañan no te piden que olvides. Te piden que recuerdes con paz. Porque un alma que recuerda con dolor no puede avanzar. Y vos necesitás avanzar. Hay una imagen que aparece en tus respuestas: la de alguien guardando una foto en un cajón. No para olvidarla, sino para no verla todo el tiempo. La foto sigue ahí. El amor sigue ahí. Solo cambia la forma de mirarla. No tenés que olvidar para estar bien. A veces, el acto más valiente es recordar con paz. Esta semana, elegí un momento tranquilo y mirá una foto de esa persona o ser amado. No para llorar, sino para recordar. Recordá un momento lindo. Recordá una risa. Recordá algo que te enseñó. Y si al terminarlo sentís paz, aunque sea un poco, es señal de que estás recordando con amor. No estás solo. Los ángeles que te acompañan no te piden que olvides. Te piden que recuerdes con paz. Recordá con paz. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Juicio te invita a despertar. A recordar. A escuchar el llamado interior. Esta carta te dice que hay algo en vos que está llamando. Que hay una voz que te invita a volver. A recordar quién sos. A recordar de dónde venís. Permitite escuchar. Permitite recordar. Permitite responder al llamado. Y confiá en que, aunque no sepas a dónde vas, estás siendo guiado."}, {"id": 14, "nombre": "El Que Se Reencuentra", "carta": "La Sacerdotisa", "significado": "Intuición, sabiduría interior, conexión profunda.", "texto": "Perder a alguien que amás es una de las experiencias más difíciles que existen. No importa si fue una persona o un ser amado: el vínculo era real, y el dolor también. No estás exagerando. No estás \"tardando demasiado\" en superarlo. Estás viviendo uno de los procesos más profundos del alma humana. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Y en ese amor que sigue fluyendo, hay algo sagrado. Porque amar a alguien que ya no está físicamente es una de las formas más puras de amor que existen. No estás solo. Y esa persona o ser amado que amás tampoco desapareció del todo. Está en tu memoria, en tus gestos, en las cosas que te enseñó sin que te dieras cuenta. Tus respuestas dibujan el perfil de alguien que no solo extraña: espera. Hay una parte de vos que intuye que la historia no termina acá. Y esa intuición no es ingenuidad. Es una forma de sabiduría que muchas tradiciones han reconocido a lo largo de la historia. Los pueblos originarios de los Andes hablan de que los que se van no se van del todo: se quedan como guardianes. La tradición cristiana habla de reencuentro. La filosofía oriental habla de ciclos que vuelven a encontrarse. Y muchos médiums que acompañan a personas en duelo sostienen que nuestros seres queridos, incluidos los seres amados, no desaparecen: evolucionan. Pasan a un estado de paz desde donde siguen velando por nosotros. No importa en qué creas. Lo que importa es que tu alma lo sabe. En lo más profundo, intuye que el reencuentro existirá. Hay una imagen que aparece en tus respuestas: la de alguien parado en una orilla, mirando el horizonte. No está desesperado. Está esperando. Y esperar, cuando es con amor, no es una pérdida de tiempo. Es una forma de seguir conectado. El amor es la fuerza más potente del universo. Trasciende estados, planos y seres. Es la fuente de todo, y hacia ahí volveremos. Esta semana, elegí un momento tranquilo y escribí una carta a esa persona o ser amado. No para despedirte, porque no te estás despidiendo. Para contarle cómo estás, qué te pasa, qué te gustaría que supiera. Podés escribirla a mano o en el celular. No hace falta que la envíes a ningún lado. Solo escribila. Y si al terminarla sentís paz, aunque sea un poco, es señal de que el vínculo sigue vivo. No estás solo. Y esa persona o ser amado que amás tampoco desapareció del todo. Está en tu memoria, en tus gestos, en las cosas que te enseñó sin que te dieras cuenta. Muchas personas que han vivido lo mismo que vos describen momentos en los que sintieron su presencia: un aroma, un sueño, una coincidencia. No sabemos exactamente cómo funciona. Pero sabemos que el amor deja huellas que el tiempo no borra.", "mensaje_extendido": "La Sacerdotisa te invita a confiar en tu intuición. A escuchar esa voz interior que sabe más de lo que creés. Esta carta te dice que no necesitás respuestas externas. Que la sabiduría está en vos. Permitite escuchar. Permitite confiar. Permitite que tu intuición te guíe. Y recordá que el silencio no es vacío. Es el lugar donde el alma habla."}, {"id": 15, "nombre": "El Que Aprende a Soltar", "carta": "Los Enamorados", "significado": "Elección, vínculos, amor que trasciende.", "texto": "Hay algo en vos que está aprendiendo a soltar. Una parte de tu alma que ya sabe que tiene que dejar ir, pero que todavía no puede. Y esa tensión entre saber y poder es una de las cosas que más te pesa. No estás solo. Y no tenés que soltar de un día para el otro. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que sueltes ya. Necesita que te permitas soltar de a poco. Tus respuestas dibujan el perfil de alguien que está en proceso. Alguien que ya sabe que tiene que soltar. Alguien que ya intuye que el dolor no es para siempre. Alguien que ya está en paz, pero le cuesta. Y ese proceso, aunque es lento, es sagrado. Los ángeles que te acompañan no te piden que sueltes ya. Te piden que confíes en el proceso. Porque un alma que se apura a soltar termina aferrándose más. Y vos necesitás tiempo. Hay una imagen que aparece en tus respuestas: la de alguien sosteniendo un pájaro en la mano. El pájaro no está herido. Solo está ahí. Y en algún momento, la mano tiene que abrirse. No porque el pájaro se vaya a ir, sino porque la mano necesita descansar. No tenés que soltar de golpe. A veces, el acto más valiente es permitirte soltar de a poco. Esta semana, elegí un momento tranquilo y escribí una carta a esa persona o ser amado. No para despedirte. Para contarle cómo estás, qué te pasa, qué te gustaría que supiera. Y si al terminarla sentís paz, aunque sea un poco, es señal de que estás soltando. No estás solo. Los ángeles que te acompañan no te piden que sueltes ya. Te piden que confíes en el proceso. Soltá de a poco. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "Los Enamorados te invitan a elegir. A confiar en el amor. A reconocer que los vínculos son sagrados. Esta carta te dice que el amor no es debilidad. Es la fuerza más potente del universo. Permitite amar. Permitite elegir. Permitite confiar en los vínculos que te sostienen. Y recordá que el amor verdadero no ata. Libera."}, {"id": 16, "nombre": "El Que Protege", "carta": "El Papa", "significado": "Guía, enseñanza, protección espiritual.", "texto": "Hay algo en vos que te lleva a proteger. A cuidar. A estar pendiente de los demás. Y eso, aunque es una forma de amor, también es una forma de olvidarte de vos. No estás solo. Y no tenés que proteger a todos. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que cuides más. Necesita que te permitas ser cuidado. Tus respuestas dibujan el perfil de alguien que ha aprendido a proteger. Alguien que ha aprendido a cuidar. Alguien que ha aprendido a estar pendiente de los demás antes que de sí mismo. Y esa protección, aunque es un regalo, también es un agotamiento. Los ángeles que te acompañan no te piden que protejas más. Te piden que te protejas también a vos. Porque un alma que cuida a todos menos a sí misma termina vaciándose. Y vos no viniste a vaciarte. Hay una imagen que aparece en tus respuestas: la de alguien sosteniendo un paraguas para que otros no se mojen. Pero el que sostiene el paraguas también se moja. Y en algún momento, hay que compartir el paraguas. No tenés que proteger a todos para ser digno de amor. A veces, el acto más valiente es permitirte ser protegido. Esta semana, elegí un día para no proteger a nadie. No para ser egoísta, sino para descansar. No te adelantes a lo que puede pasar. No resuelvas problemas. Solo estate. Y si aparece la culpa, respirá y decite: \"Esto también es parte de cuidarme.\" No estás solo. Los ángeles que te acompañan no te piden que protejas más. Te piden que te permitas ser protegido. Permitite ser protegido. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Papa te invita a confiar en la guía. A reconocer que hay maestros en tu camino. A permitirte ser enseñado. Esta carta te dice que no estás solo. Que hay guías que te acompañan. Que hay ángeles que te susurran al oído. Permitite escuchar. Permitite aprender. Permitite ser guiado. Y confiá en que, aunque no veas el camino, alguien lo está trazando para vos."}, {"id": 17, "nombre": "El Que Confía", "carta": "La Rueda", "significado": "Ciclos, cambio, confianza en el proceso.", "texto": "Hay algo en vos que está aprendiendo a confiar. Una parte de tu alma que ya sabe que no puede controlar todo, pero que todavía se resiste. Y esa resistencia, aunque es humana, también es agotadora. No estás solo. Y no tenés que controlar todo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que controles más. Necesita que confíes. Tus respuestas dibujan el perfil de alguien que ha aprendido a controlar. Alguien que ha aprendido a prever. Alguien que ha aprendido a no soltar. Y ese control, aunque te ha dado seguridad, también te ha quitado paz. Los ángeles que te acompañan no te piden que controles más. Te piden que confíes. Porque un alma que controla todo no puede descansar. Y vos necesitás descansar. Hay una imagen que aparece en tus respuestas: la de alguien sosteniendo un timón con las dos manos. Pero el río ya sabe a dónde va. Y en algún momento, hay que soltar el timón y confiar en la corriente. No tenés que controlar todo. A veces, el acto más valiente es soltar el timón y confiar. Esta semana, elegí una cosa que no podés controlar y soltala. No para ser irresponsable, sino para descansar. No te adelantes a lo que puede pasar. No resuelvas lo que no te toca. Solo estate. Y si aparece la ansiedad, respirá y decite: \"Esto también es parte de confiar.\" No estás solo. Los ángeles que te acompañan no te piden que controles más. Te piden que confíes. Confiá. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Rueda te invita a confiar en los ciclos. A reconocer que todo cambia. A soltar el control. Esta carta te dice que no todo depende de vos. Que hay fuerzas más grandes obrando. Que hay un ritmo en el universo. Permitite fluir. Permitite confiar. Permitite que la vida te sorprenda. Y recordá que, aunque hoy estés abajo, mañana vas a estar arriba. Todo pasa. Todo vuelve."}, {"id": 18, "nombre": "El Que Agradece", "carta": "El Mago", "significado": "Manifestación, poder personal, gratitud.", "texto": "Hay algo en vos que agradece. Una parte de tu alma que encuentra belleza en lo pequeño, en lo cotidiano, en lo que otros no ven. Y esa gratitud, aunque es un regalo, también es un camino. No estás solo. Y no tenés que agradecer todo el tiempo. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que agradezcas más. Necesita que te permitas recibir. Tus respuestas dibujan el perfil de alguien que ha aprendido a agradecer. Alguien que ha aprendido a ver belleza donde otros ven rutina. Alguien que ha aprendido a encontrar paz en lo simple. Y esa gratitud, aunque es una forma de sabiduría, también es una forma de entrega. Los ángeles que te acompañan no te piden que agradezcas más. Te piden que te permitas recibir. Porque un alma que solo da gracias pero no recibe se vacía. Y vos no viniste a vaciarte. Hay una imagen que aparece en tus respuestas: la de alguien mirando el atardecer. No está apurado. No está triste. Solo está mirando. Y en ese mirar, hay una forma de oración. La gratitud no es solo dar gracias. También es permitirte recibir. Esta semana, elegí un momento del día para recibir algo. No para dar, no para agradecer, no para producir. Solo para recibir. Puede ser un halago, un abrazo, un momento de paz. Recibilo sin culpa. Y si aparece la incomodidad, respirá y decite: \"Esto también es parte de agradecer.\" No estás solo. Los ángeles que te acompañan no te piden que agradezcas más. Te piden que te permitas recibir. Recibí. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "El Mago te invita a reconocer tu poder. A confiar en tu capacidad de crear. A manifestar lo que deseás. Esta carta te dice que tenés todo lo que necesitás. Que el poder está en vos. Que podés crear la realidad que soñás. Permitite crear. Permitite manifestar. Permitite confiar en tu magia. Y recordá que el universo conspira a tu favor."}, {"id": 19, "nombre": "El Que Perdona", "carta": "La Justicia", "significado": "Equilibrio, perdón, verdad.", "texto": "Hay algo en vos que está aprendiendo a perdonar. No a los demás. A vos. Una parte de tu alma que todavía se juzga, que todavía se castiga, que todavía no se permite ser humana. Y ese juicio, aunque parece justo, no te está ayudando. No estás solo. Y no tenés que castigarte. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que te juzgues. Necesita que te perdones. Tus respuestas dibujan el perfil de alguien que ha aprendido a exigirse. Alguien que ha aprendido a juzgarse. Alguien que ha aprendido a no perdonarse. Y esa exigencia, aunque te ha hecho crecer, también te ha hecho daño. Los ángeles que te acompañan no te piden que te juzgues. Te piden que te perdones. Porque un alma que no se perdona no puede avanzar. Y vos necesitás avanzar. Hay una imagen que aparece en tus respuestas: la de alguien mirándose al espejo con dureza. Pero el espejo no muestra la verdad. Muestra lo que creés de vos. Y lo que creés de vos no es lo que sos. No tenés que castigarte para ser mejor. A veces, el acto más valiente es perdonarte. Esta semana, elegí un momento tranquilo y escribí una carta de perdón hacia vos mismo. No para justificar lo que hiciste. Para reconocer que hiciste lo mejor que pudiste con lo que tenías. Escribila a mano. Y si al terminarla sentís paz, aunque sea un poco, es señal de que estás perdonando. No estás solo. Los ángeles que te acompañan no te piden que te juzgues. Te piden que te perdones. Perdonate. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Justicia te invita a equilibrar. A perdonar. A soltar la culpa. Esta carta te dice que no estás en deuda. Que no tenés que pagar nada. Que podés soltar el peso. Permitite equilibrar. Permitite perdonar. Permitite perdonarte. Y recordá que el perdón no es para el otro. Es para vos."}, {"id": 20, "nombre": "El Que Camina", "carta": "El Carro", "significado": "Avance, dirección, victoria sobre la oscuridad.", "texto": "Hay algo en vos que sigue caminando. Aunque no veas el final. Aunque no sepas a dónde vas. Aunque el camino sea largo y a veces solitario. Y esa perseverancia, aunque es una forma de fe, también es una forma de cansancio. No estás solo. Y no tenés que ver el final para seguir. Lo que sentís no es debilidad. Es amor que sigue fluyendo, incluso cuando ya no encuentra a quién abrazar. Pero ese amor también tiene que fluir  Pero ese amor también tiene que fluir hacia vos. Tu alma no necesita que te apures. Necesita que confíes en el proceso. Tus respuestas dibujan el perfil de alguien que está sanando. Alguien que ha atravesado dolores. Alguien que ha aprendido a mirarse. Alguien que ha decidido volver a casa. Y esa sanación, aunque es un proceso, ya empezó. Los ángeles que te acompañan no te piden que sanes más rápido. Te piden que confíes en el proceso. Porque un alma que se apura a sanar termina reabriendo heridas. Y vos necesitás tiempo. Hay una imagen que aparece en tus respuestas: la de una herida que está cerrando. No está cerrada todavía. Pero ya no sangra. Y eso, aunque parece poco, es un milagro. No tenés que sanar de un día para el otro. A veces, el acto más valiente es confiar en el proceso. Esta semana, elegí un momento tranquilo y escribí una carta a tu herida. No para justificarla. Para reconocerla. Decile que la ves. Decile que la estás cuidando. Decile que va a sanar. Y si al terminarla sentís paz, aunque sea un poco, es señal de que estás sanando. No estás solo. Los ángeles que te acompañan no te piden que sanes más rápido. Te piden que confíes en el proceso. Saná. No estás fallando. Estás volviendo a vos.", "mensaje_extendido": "La Torre te invita a liberarte. A soltar lo que ya no te sirve. A reconstruir sobre nuevas bases. Esta carta te dice que lo que se cae no es tu vida. Es una versión de tu vida que ya no te representa. Permitite que se caiga. Permitite liberarte. Permitite reconstruir. Y confiá en que lo que viene es más liviano, más verdadero, más tuyo."}, {"id": 22, "nombre": "El Que Vuelve a Casa", "carta": "El Diablo", "significado": "Liberación de ataduras, sombra, regreso a la luz.", "texto": "Hay algo en vos que sabe que esta vida no es el final. No lo sabés con la mente, lo sabés con el alma. Es una certeza silenciosa que te acompaña incluso en los momentos más difíciles. Y esa certeza, aunque a veces no sepas de dónde viene, es uno de tus mayores tes o para darte un mapa, sino para recordarte que el camino ya está trazado. No estás lejos. Estás volviendo. Y el hogar siempre te espera.", "mensaje_extendido": "El Diablo te invita a mirar tu sombra. A reconocer tus ataduras. A liberarte. Esta carta te dice que no estás condenado. Que la oscuridad no es tu destino. Que podés salir. Permitite mirar. Permitite reconocer. Permitite liberarte. Y recordá que la luz siempre está más cerca de lo que creés."}]};
const CARDS = {"el carro": "img/el-carro.webp", "el colgado": "img/el-colgado.webp", "el diablo": "img/el-diablo.webp", "el emperador": "img/el-emperador.webp", "el ermitanio": "img/el-ermitanio.webp", "el juicio": "img/el-juicio.webp", "el loco": "img/el-loco.webp", "el mago": "img/el-mago.webp", "el mundo": "img/el-mundo.webp", "el papa": "img/el-papa.webp", "el sol": "img/el-sol.webp", "la emperatriz": "img/la-emperatriz.webp", "la estrella": "img/la-estrella.webp", "la fuerza": "img/la-fuerza.webp", "la justicia": "img/la-justicia.webp", "la luna": "img/la-luna.webp", "la muerte": "img/la-muerte.webp", "la rueda": "img/la-rueda.webp", "la sacerdotisa": "img/la-sacerdotisa.webp", "la templanza": "img/la-templanza.webp", "la torre": "img/la-torre.webp", "los enamorados": "img/los-enamorados.webp"};
const COVER = "img/portada.webp";
// Dirección del Apps Script que crea el pago en Mercado Pago. Vacía = modo prototipo.
const PAGOS = {"endpoint": ""};
const ars = n => "$ " + n.toLocaleString("es-AR");
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

const qs = DATA.secciones.flatMap(s => s.preguntas.map(q => ({ ...q, sec: s })));
const LOSS_FILTER = 17;
const answers = {};
let step = -1; // -1 portada, 0..n-1 preguntas, "form", "result"
let user = { nombre: "", email: "" };
let unlocked = false;
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace("ermitano", "ermitanio");
const cardImg = carta => CARDS[norm(carta)] || "";
const hadLoss = () => answers[LOSS_FILTER] !== undefined && answers[LOSS_FILTER] !== 3;

function visible() {
  return qs.filter(q => !(q.id > LOSS_FILTER && answers[LOSS_FILTER] === 3));
}

function render() {
  window.scrollTo(0, 0);
  if (step === -1) return renderIntro();
  if (step === "form") return renderForm();
  if (step === "result") return renderResult();
  renderQuestion();
}

function renderIntro() {
  app.innerHTML = `
  <div class="screen stack" style="gap:22px">
    ${COVER ? `<div class="cover"><img src="${COVER}" alt=""></div>` : ""}
    <span class="eyebrow">Camino de vida</span>
    <h1>${esc(DATA.titulo)}</h1>
    <p class="muted">${esc(DATA.descripcion)} Al final vas a conocer tu arquetipo y la carta del tarot que te acompaña en este momento.</p>
    <div class="facts"><span>16 preguntas</span><span>3–4 minutos</span><span>22 arquetipos posibles</span></div>
    <button class="btn" id="go">Empezar el test</button>
    <p class="notice">${esc(DATA.aviso)}</p>
  </div>`;
  document.getElementById("go").onclick = () => { step = 0; render(); };
}

function renderQuestion() {
  const list = visible();
  const q = list[step];
  const total = hadLoss() || answers[LOSS_FILTER] === undefined ? list.length : list.length;
  const firstOfSection = step === 0 || list[step - 1].sec.id !== q.sec.id;
  app.innerHTML = `
  <div class="top">
    <button class="back" id="back">← Atrás</button>
    <div class="progress"><i style="width:${Math.round((step / total) * 100)}%"></i></div>
    <span class="count">${step + 1} / ${total}</span>
  </div>
  <div class="screen stack" style="gap:18px">
    <div class="section-tag"><span class="eyebrow">${esc(q.sec.nombre)}</span></div>
    ${firstOfSection && q.sec.intro ? `<p class="interlude">${esc(q.sec.intro)}</p>` : ""}
    <p class="q" id="qtext">${esc(q.texto)}</p>
    <div class="opts" role="group" aria-labelledby="qtext">
      ${q.opciones.map((o, i) => `<button class="opt${answers[q.id] === i ? " sel" : ""}" data-i="${i}"><b>${"ABCD"[i]}</b><span>${esc(o.texto)}</span></button>`).join("")}
    </div>
  </div>`;
  document.getElementById("back").onclick = () => { step = step === 0 ? -1 : step - 1; render(); };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    answers[q.id] = +b.dataset.i;
    b.classList.add("sel");
    setTimeout(() => {
      const l = visible();
      step = step + 1 < l.length ? step + 1 : "form";
      render();
    }, 220);
  });
}

function renderForm() {
  app.innerHTML = `
  <div class="top">
    <button class="back" id="back">← Atrás</button>
    <div class="progress"><i style="width:100%"></i></div>
    <span class="count">Listo</span>
  </div>
  <form class="screen stack" id="f" novalidate style="gap:18px">
    <span class="eyebrow">Tu resultado está listo</span>
    <h2>¿A quién le enviamos tu mensaje?</h2>
    <p class="muted">Te mostramos tu arquetipo ahora y te enviamos una copia por email.</p>
    <div><label for="nombre">Tu nombre</label><input id="nombre" autocomplete="given-name" value="${esc(user.nombre)}"></div>
    <div><label for="email">Tu email</label><input id="email" type="email" autocomplete="email" value="${esc(user.email)}"></div>
    <p class="err" id="err"></p>
    <button class="btn" type="submit">Ver mi arquetipo</button>
  </form>`;
  document.getElementById("back").onclick = () => { step = visible().length - 1; render(); };
  document.getElementById("f").addEventListener("submit", e => {
    e.preventDefault();
    const n = document.getElementById("nombre").value.trim();
    const m = document.getElementById("email").value.trim();
    const err = document.getElementById("err");
    if (!n) { err.textContent = "Escribí tu nombre para personalizar el mensaje."; return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)) { err.textContent = "Revisá el email: parece que le falta algo."; return; }
    user = { nombre: n, email: m };
    step = "result"; render();
  });
}

function score() {
  const pts = {}, avail = {};
  for (const q of visible()) {
    const a = answers[q.id];
    if (a === undefined) continue;
    const present = new Set(q.opciones.flatMap(o => o.arquetipos));
    present.forEach(id => avail[id] = (avail[id] || 0) + 1);
    q.opciones[a].arquetipos.forEach(id => pts[id] = (pts[id] || 0) + 1);
  }
  const exp = DATA.puntuacion.exponente;
  let best = -1, winners = [];
  for (const id in avail) {
    const s = (pts[id] || 0) / Math.pow(avail[id], exp);
    if (s > best + 1e-9) { best = s; winners = [+id]; }
    else if (Math.abs(s - best) < 1e-9) winners.push(+id);
  }
  // desempate estable: el mismo set de respuestas siempre da el mismo arquetipo
  const seed = Object.values(answers).join("").split("").reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7);
  return DATA.arquetipos.find(a => a.id === winners[seed % winners.length]);
}

let result = null;
function renderResult() {
  result = result || score();
  const a = result;
  const img = cardImg(a.carta);

  let teaser = ""; for (const s of paras) { if (teaser.length > 420) break; teaser += s; }
  const p = DATA.productos;
  app.innerHTML = `
  <div class="screen stack" style="gap:24px">
    <span class="eyebrow">${esc(user.nombre)}, tu arquetipo es</span>
    <div class="reveal">
      <div class="card">${img ? `<img src="${img}" alt="Carta ${esc(a.carta)}">` : esc(a.carta)}</div>
      <div class="stack" style="gap:8px">

    ${unlocked ? fullResult(a) : `
    <div class="teaser"><div class="fade">${esc(teaser)}</div></div>

    </div>

        <ul><li>Tu arquetipo explicado en profundidad</li><li>El mensaje de ${esc(a.carta)} para vos</li>${hadLoss() ? "<li>Un mensaje para tu duelo</li>" : ""}<li>PDF en tu email al instante</li></ul>
        <button class="btn ghost" data-buy="basico">Quiero mi mensaje</button>
      </div>
      <div class="offer featured">
        <span class="badge">Recomendado</span>
        <div class="offer-head"><h3>Mensaje personal</h3><span class="price">${ars(p.personalizado.precio_ars)}</span></div>
        <ul><li>Todo lo del Mensaje del alma</li><li>Audio guiado de tu arquetipo</li><li>Un audio grabado solo para vos, por WhatsApp, en 48 horas</li></ul>
        <button class="btn gold" data-buy="personalizado">Quiero mi mensaje personal</button>
      </div>
    </div>
    <div class="demo" id="demo" hidden></div>
    <p class="notice">${esc(DATA.aviso)}</p>`}
  </div>`;
  app.querySelectorAll("[data-buy]").forEach(b => b.onclick = () => {
    if (PAGOS.endpoint) return checkout(b.dataset.buy);
    const d = document.getElementById("demo");
    d.hidden = false;
    if (!PAGOS.demo) { d.textContent = "Los pagos se habilitan en los próximos días. Guardá esta página y volvé pronto."; return; }
    d.innerHTML = `Prototipo: el pago todavía no está conectado. <button id="unlock">Ver el resultado completo como si hubieras pagado</button>`;
    document.getElementById("unlock").onclick = () => { unlocked = true; render(); };
    d.scrollIntoView({ behavior: "smooth", block: "center" });
  });
  const again = document.getElementById("again");
  if (again) again.onclick = () => { for (const k in answers) delete answers[k]; result = null; unlocked = false; step = -1; render(); };
}

function checkout(producto) {
  const d = document.getElementById("demo");
  d.hidden = false;
  if (producto === "personalizado") {
    d.innerHTML = `<form id="wa" class="stack" style="gap:10px" novalidate>
      <label for="tel">Tu WhatsApp, con código de país (ej. +54 9 11 1234 5678)</label>
      <input id="tel" type="tel" autocomplete="tel" inputmode="tel">
      <p class="err" id="werr"></p>
      <button class="btn gold" type="submit">Ir a pagar con Mercado Pago</button></form>`;
    document.getElementById("wa").addEventListener("submit", e => {
      e.preventDefault();
      const tel = document.getElementById("tel").value.trim();
      if (tel.replace(/\D/g, "").length < 8) { document.getElementById("werr").textContent = "Revisá el número: necesitamos tu WhatsApp para enviarte el audio."; return; }
      pagar(producto, tel);
    });
    document.getElementById("tel").focus();
  } else pagar(producto, "");
  d.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function pagar(producto, telefono) {
  const d = document.getElementById("demo");
  d.textContent = "Preparando tu pago…";
  store.set("alma", { answers, user, resultId: result.id });
  try {
    const r = await fetch(PAGOS.endpoint, { method: "POST", body: JSON.stringify({
      accion: "crear", producto, nombre: user.nombre, email: user.email, telefono,
      arquetipo_id: result.id, perdida: hadLoss(), respuestas: answers }) });
    const j = await r.json();
    if (!j.url) throw new Error(j.error || "sin url");
    location.href = j.url;
  } catch (e) {
    d.textContent = "No pudimos abrir Mercado Pago. Revisá tu conexión e intentá de nuevo en unos segundos.";
  }
}

function fullResult(a) {
  const paras = a.texto.split(/(?<=[.!?]["”]?)\s+(?=[A-ZÁÉÍÓÚÑ¿"“])/).reduce((acc, s, i) => {
    const k = Math.floor(i / 4); (acc[k] = acc[k] || []).push(s); return acc;
  }, []).map(g => `<p>${esc(g.join(" "))}</p>`).join("");
  return `
    <div class="full stack" style="gap:0">${paras}</div>
    <div class="block"><span class="eyebrow">El mensaje de tu carta</span><h3>${esc(a.carta)}</h3><p>${esc(a.mensaje_extendido)}</p></div>
    ${hadLoss() ? `<div class="block"><span class="eyebrow">Para quien partió</span><p>${esc(DATA.mensaje_duelo)}</p></div>` : ""}
    <p class="notice">${esc(DATA.aviso)}</p>
    <button class="btn ghost" id="again">Hacer el test otra vez</button>`;
}

    Object.assign(answers, saved.answers); user = saved.user;
    result = DATA.arquetipos.find(a => a.id === saved.resultId);
    unlocked = pago === "ok"; step = "result";
  }
  render();
  if (saved && pago !== "ok") {
    const d = document.getElementById("demo");
    d.hidden = false;
    d.textContent = pago === "pendiente" ? "Tu pago está pendiente. Cuando Mercado Pago lo confirme, te enviamos el mensaje por email." : "El pago no se completó. Podés intentarlo de nuevo.";
  }
  if (saved && pago === "ok") {
    const n = document.createElement("p");
    n.className = "demo"; n.textContent = "Pago recibido. También te enviamos este mensaje en PDF a " + user.email + ".";
    app.firstElementChild.insertBefore(n, app.firstElementChild.children[1]);
  }
})();
</script>

</html>
